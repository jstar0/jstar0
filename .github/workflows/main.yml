name: Profile README

on:
  pull_request:
    paths:
      - ".github/workflows/main.yml"
      - ".gitignore"
      - ".profile-readme-assets.json"
      - "README.md"
      - "assets/**"
      - "profile-readme-generator/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main.yml"
      - ".gitignore"
      - ".profile-readme-assets.json"
      - "README.md"
      - "assets/**"
      - "profile-readme-generator/**"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GENERATOR_DIR: profile-readme-generator
  CI: true
  TZ: UTC

jobs:
  verify:
    name: Verify generated profile
    if: ${{ github.event_name == 'pull_request' }}
    # PNGs are browser-rasterized artifacts. Keep CI on the pinned macOS
    # runner family used for the canonical profile assets.
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: profile-readme-generator/pnpm-lock.yaml

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install generator dependencies
        run: pnpm --dir "$GENERATOR_DIR" install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir "$GENERATOR_DIR" exec playwright install chromium

      - name: Run portable production QA
        run: pnpm --dir "$GENERATOR_DIR" qa:ci

      - name: Rebuild the published profile files
        run: pnpm --dir "$GENERATOR_DIR" publish:profile -- --destination "$GITHUB_WORKSPACE" --prune-managed

      - name: Verify the published profile files
        run: pnpm --dir "$GENERATOR_DIR" check:published -- --destination "$GITHUB_WORKSPACE"

      - name: Reject stale generated output
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  publish:
    name: Refresh and publish profile
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    # Keep generated PNG rasterization stable across scheduled updates.
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: profile-readme-generator/pnpm-lock.yaml

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install generator dependencies
        run: pnpm --dir "$GENERATOR_DIR" install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir "$GENERATOR_DIR" exec playwright install chromium

      - name: Refresh public GitHub data
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --dir "$GENERATOR_DIR" sync:github

      - name: Run portable production QA
        run: pnpm --dir "$GENERATOR_DIR" qa:ci

      - name: Publish generated README and assets
        run: pnpm --dir "$GENERATOR_DIR" publish:profile -- --destination "$GITHUB_WORKSPACE" --prune-managed

      - name: Verify published files
        run: pnpm --dir "$GENERATOR_DIR" check:published -- --destination "$GITHUB_WORKSPACE"

      - name: Check generated diff
        run: git diff --check

      - name: Commit and push generated changes
        run: |
          git config user.name "jstar0"
          git config user.email "54024410+jstar0@users.noreply.github.com"
          # The runner starts from a clean checkout. Stage the complete
          # generated diff so future asset additions and removals are covered.
          git add -A -- .
          if git diff --cached --quiet; then
            echo "No generated profile changes to commit."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated profile [skip ci]"
          git push origin HEAD:main
